# CachyOS's own /usr/lib/sysctl.d/70-cachyos-settings.conf disables the NMI
# hardlockup watchdog by default (kernel.nmi_watchdog = 0), for a marginal
# performance/power gain. This file overrides it back on - sorts after "70-"
# alphabetically, so it wins. See README.md "Freeze diagnostics" for why.
kernel.nmi_watchdog = 1
